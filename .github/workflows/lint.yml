name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint with ruff
        run: uv run --locked ruff check custom_components tests

      - name: Check formatting with ruff
        run: uv run --locked ruff format --check custom_components tests

      - name: Check translation keys
        run: uv run --locked python scripts/check_translations.py
