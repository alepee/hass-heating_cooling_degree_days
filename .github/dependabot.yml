# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Paris'
      open-pull-requests-limit: 3
      groups:
          github-actions:
              applies-to: 'version-updates'
              patterns: ['*']

    - package-ecosystem: 'uv'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Paris'
      open-pull-requests-limit: 3
      groups:
          dev-tooling:
              applies-to: 'version-updates'
              patterns: ['pre-commit', 'colorlog']
              exclude-patterns: ['ruff']
              update-types: ['minor', 'patch']
      ignore:
          # phac pins HA, pytest and pytest-asyncio. A single newest phac pin
          # cannot cover all supported Python versions in the universal lock.
          # Update this family together manually; the latest CI row is a canary.
          - dependency-name: 'homeassistant'
          - dependency-name: 'pytest-homeassistant-custom-component'
          - dependency-name: 'pytest'
          - dependency-name: 'pytest-asyncio'
